<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hide Ubuntu's per-script Noto fonts (fonts-noto-core, fonts-noto-cjk:
  ~200 families such as "Noto Sans Adlam" or "Noto Naskh Arabic") from
  every app's font list. Symlinked to ~/.config/fontconfig/conf.d/ by
  link.sh; fontconfig reads it through /etc/fonts/conf.d/50-user.conf.

  Rejected fonts are gone for fallback too, so text in those scripts shows
  as boxes; only US English is needed here. Kept: Noto Sans and Noto Serif
  (the default sans-serif and serif), the monospace ones, the math and
  symbol fonts (arrows, technical symbols), and the emoji font.

  The keep-list names files, not families: fontconfig drops a file that
  a rejectfont glob matches before reading its family, so only an
  acceptfont glob can save it. "NotoSans-*" doesn't match
  "NotoSansAdlam-*" (the dash comes right after the family).

  To undo on one machine: delete the symlink and run fc-cache -f.
-->
<fontconfig>
  <selectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/noto/NotoSans-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSerif-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSansMono-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoMono-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSansMath-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSansSymbols-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoSansSymbols2-*</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji*</glob>
    </acceptfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
      <glob>/usr/share/fonts/opentype/noto/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
