# Default editor for the desktop session: apps started from GNOME (git GUIs,
# editors that shell out, systemd user services) don't read the shell rc
# files, which set the same two for terminals. Symlinked to
# ~/.config/environment.d/ by link.sh; read at login (systemd user manager).
# nvim is found on PATH (mise's shims, from ~/.profile / ~/.zprofile).
EDITOR=nvim
VISUAL=nvim
