# Added by Gogh
general.import = ["~/.config/alacritty/gogh.toml"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 1

[scrolling]
history = 10000
multiplier = 3

[font]
size = 22.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[keyboard]
bindings = [
  { key = "K", mods = "Control|Shift", mode = "~Vi|~Search", chars = "\u000c" },
  { key = "K", mods = "Control|Shift", mode = "~Vi|~Search", action = "ClearHistory" },
  { key = "R", mods = "Control|Shift", mode = "~Vi|~Search", chars = "\u0015reset\r" },
  { key = "R", mods = "Control|Shift", mode = "~Vi|~Search", action = "ClearHistory" },
]

