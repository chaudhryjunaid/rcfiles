# Kept in line with kitty and Ghostty: same font, Cobalt2 colors (gogh.toml),
# padding, cursor and scrollback. Set the font with the repo's set-font.sh.
# Alacritty reloads this file on save; `alacritty migrate --dry-run` checks it.

# Added by Gogh
general.import = ["~/.config/alacritty/gogh.toml"]

[window]
padding = { x = 8, y = 8 }
# Spread leftover space (from the grid not filling the window) evenly.
dynamic_padding = true
# Dark client-side title bar on GNOME (light by default).
decorations_theme_variant = "Dark"

[scrolling]
# Alacritty's maximum.
history = 100000

[font]
size = 22.0

[font.normal]
family = "Aglet Mono"
style = "Regular"

[font.bold]
family = "Aglet Mono"
style = "Bold"

[font.italic]
family = "Aglet Mono"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
# Selecting copies to the clipboard too, not just the primary selection.
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "K", mods = "Control|Shift", mode = "~Vi|~Search", chars = "\u000c" },
  { key = "K", mods = "Control|Shift", mode = "~Vi|~Search", action = "ClearHistory" },
  { key = "R", mods = "Control|Shift", mode = "~Vi|~Search", chars = "\u0015reset\r" },
  { key = "R", mods = "Control|Shift", mode = "~Vi|~Search", action = "ClearHistory" },
]
