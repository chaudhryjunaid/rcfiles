# Color theme: Cobalt2
# Same palette as kitty's colors.conf and Ghostty's built-in Cobalt2. Re-run
# Gogh to switch themes (it rewrites this file).

[colors.primary]
background = "#132738"
foreground = "#FFFFFF"

[colors.cursor]
text = "#98998C"
cursor = "#F0CC09"

[colors.selection]
text = "#B5B5B5"
background = "#18354F"

[colors.normal]
black = "#000000"
red = "#FF0000"
green = "#38DE21"
yellow = "#FFE50A"
blue = "#1460D2"
magenta = "#FF005D"
cyan = "#00BBBB"
white = "#BBBBBB"

[colors.bright]
black = "#555555"
red = "#F40E17"
green = "#3BD01D"
yellow = "#EDC809"
blue = "#5555FF"
magenta = "#FF55FF"
cyan = "#6AE3FA"
white = "#FFFFFF"
