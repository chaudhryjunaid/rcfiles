# Global mise config: every CLI tool these dotfiles rely on that isn't a
# system package. Symlinked to ~/.config/mise/config.toml by link.sh, so
# `mise use -g <tool>@<version>` edits this tracked file.
#
#   mise install    install anything missing
#   mise upgrade    move "latest" tools to their newest release
#   mise ls         show what's installed and active

[settings]
# Honour .nvmrc / .node-version, so cd-ing into a repo that pins node (the
# CAN-Go backend's .nvmrc, which CI also reads) switches to that version.
idiomatic_version_file_enable_tools = ["node"]
# Leave GOBIN unset so `go install` uses $GOPATH/bin (~/.local/share/go/bin,
# exported and put on PATH by .shellrc.sh)
# rather than the current Go version's install dir, which an upgrade drops.
go.set_gobin = false

[tools]
node = "26"           # mason's LSP servers need node/npm
go = "latest"         # also lets mason install gopls
java = "25"           # current LTS; mise's default vendor is temurin
neovim = "latest"
tree-sitter = "latest" # nvim-treesitter (main) builds parsers with it
fzf = "latest"
ripgrep = "latest"
bat = "latest"
delta = "latest"
zoxide = "latest"
duf = "latest"
shellcheck = "latest" # used by lint.sh
eza = "latest"
fd = "latest"
jq = "latest"
shfmt = "latest"
hyperfine = "latest"
miller = "latest"
btop = "latest"
dust = "latest"
jless = "latest"
jnv = "latest"
uv = "latest"
tokei = "latest"      # built with cargo (rustup): no release binaries past 12.x
# Not in mise's registry: prebuilt GitHub release binaries.
"github:dalance/procs" = "latest"
"github:max-niederman/ttyper" = "latest"
