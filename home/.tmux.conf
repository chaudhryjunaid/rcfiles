# Modern macOS-themed tmux configuration with backtick as prefix
# Place this in ~/.tmux.conf

# ==========================
# General Settings
# ==========================

# Change prefix from Ctrl-b to backtick (`)
unbind C-b
set-option -g prefix `
bind ` send-prefix  # Press ` twice to send actual backtick

# Enable mouse support for scrolling and pane selection
set -g mouse on

# Start window and pane numbering at 1 (more intuitive)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 100000

# ==========================
# Terminal Features
# ==========================

# tmux-256color gives programs italics and correct key handling; RGB enables
# true color for the outer terminals we use. Falls back to xterm-256color where
# the tmux-256color terminfo entry is missing.
set -g default-terminal "xterm-256color"
if-shell "infocmp tmux-256color >/dev/null 2>&1" 'set -g default-terminal "tmux-256color"'
set -as terminal-features ",xterm-kitty:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# Undercurl and colored underlines (for vim/neovim diagnostics).
set -as terminal-features ',*:usstyle'

# Pass Ctrl+Enter, Ctrl+Shift+<key> etc. through to apps that ask for them
# (nvim, Claude Code).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Clipboard integration (OSC 52; works over SSH)
set -g set-clipboard on

# Short delay after Esc (tmux's default). 0 can split terminal replies and
# leak junk like `10;rgb:...` into the pane, especially over SSH.
set -sg escape-time 10

# Enable vi mode for copy mode
setw -g mode-keys vi

# Enable focus events (useful for vim)
set -g focus-events on

# ==========================
# Modern Theme & Colors
# ==========================

# Status bar general styling (transparent with subtle backdrop)
set -g status-style 'bg=#1e2030 fg=#c8d3f5'

# Status bar position
set -g status-position bottom

# Status bar left side - Session info with icon
set -g status-left-length 40
set -g status-left '#[fg=#82aaff,bg=#2f334d,bold] ⚡ #S #[fg=#2f334d,bg=#1e2030]'

# Linux clipboard integration: copy-pipe sends copies here. Prefers Wayland,
# then X11 tools; picked once at load. set-clipboard (OSC 52) also copies,
# which is what works over SSH.
if-shell 'command -v wl-copy >/dev/null 2>&1' {
  set -s copy-command 'wl-copy'
} {
  if-shell 'command -v xclip >/dev/null 2>&1' {
    set -s copy-command 'xclip -selection clipboard -in'
  } {
    if-shell 'command -v xsel >/dev/null 2>&1' {
      set -s copy-command 'xsel --clipboard --input'
    }
  }
}

# Status bar right side - Modern system info
set -g status-right-length 100
set -g status-right "#[fg=#2f334d,bg=#1e2030]#[fg=#c8d3f5,bg=#2f334d] 󰍛 #(sh -c 'for battery in /sys/class/power_supply/BAT*/capacity; do [ -r \"$battery\" ] && { printf \"%s%%\" \"$(cat \"$battery\")\"; exit; }; done; echo AC') #[fg=#3e4451,bg=#2f334d]#[fg=#ffc777,bg=#3e4451]  %H:%M #[fg=#444a73,bg=#3e4451]#[fg=#86e1fc,bg=#444a73,bold]  %d %b "

# Window status separator
set -g window-status-separator ''

# Window status format (inactive)
setw -g window-status-format '#[fg=#1e2030,bg=#2f334d]#[fg=#828bb8,bg=#2f334d] #I  #W #[fg=#2f334d,bg=#1e2030]'

# Window status format (active) - with accent color
setw -g window-status-current-format '#[fg=#1e2030,bg=#82aaff]#[fg=#1e2030,bg=#82aaff,bold] #I  #W #[fg=#82aaff,bg=#1e2030]'

# Window status alignment
set -g status-justify left

# Pane borders - subtle and modern
set -g pane-border-style 'fg=#2f334d'
set -g pane-active-border-style 'fg=#82aaff'

# Pane number display styling
set -g display-panes-colour '#828bb8'
set -g display-panes-active-colour '#82aaff'

# Message styling (command prompt, etc.)
set -g message-style 'bg=#2f334d fg=#c8d3f5'
set -g message-command-style 'bg=#2f334d fg=#ffc777'

# Clock mode colors
setw -g clock-mode-colour '#82aaff'

# Copy mode highlighting
setw -g mode-style 'bg=#3e4451 fg=#c8d3f5'

# Bell
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# ==========================
# Window Management
# ==========================

# `c - Create new window
bind c new-window -c "#{pane_current_path}"

# `n/`p - Next/Previous window
bind n next-window
bind p previous-window

# `1-9 - Direct window switching
# (Already works by default with prefix)

# `, - Rename current window
bind , command-prompt -p "rename window:" "rename-window '%%'"

# `x - Kill current window (with confirmation)
bind x confirm-before -p "kill window #W? (y/n)" kill-window

# ==========================
# Pane Management
# ==========================

# `| - Split pane horizontally (creates vertical line)
bind | split-window -h -c "#{pane_current_path}"

# `- - Split pane vertically (creates horizontal line)
bind - split-window -v -c "#{pane_current_path}"

# `h/j/k/l - Navigate panes (vim-style)
bind h select-pane -L  # Move left
bind j select-pane -D  # Move down
bind k select-pane -U  # Move up
bind l select-pane -R  # Move right

# Ctrl-h/j/k/l (no prefix) - move between tmux panes and nvim splits
# seamlessly (pairs with christoomey/vim-tmux-navigator in init.vim). Passed
# through when the pane runs vim/nvim or fzf. `Ctrl-l clears the screen.
# Checked with a format on the pane's foreground command, so no process is
# started per keypress.
%hidden is_vim="#{m/r:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l

# `H/J/K/L - Resize panes (shift + vim keys)
bind -r H resize-pane -L 5  # Resize left
bind -r J resize-pane -D 5  # Resize down
bind -r K resize-pane -U 5  # Resize up
bind -r L resize-pane -R 5  # Resize right

# `Space - Toggle between pane layouts
bind Space next-layout

# `q - Kill current pane (with confirmation)
bind q confirm-before -p "kill pane #P? (y/n)" kill-pane

# `! - Break pane into new window
bind ! break-pane

# `m - Move pane to new window
bind m command-prompt -p "move pane to window:" "join-pane -t '%%'"

# ==========================
# Copy Mode (system clipboard integration)
# ==========================

# Setup 'v' to begin selection as in Vim
bind -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to copy selection to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Setup mouse drag to copy to the system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# `= - List paste buffers and select one to paste
bind = choose-buffer

# Double-click to select and copy word
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel

# Triple-click to select and copy line
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel

# ==========================
# Session Management
# ==========================

# `$ - Rename current session
bind '$' command-prompt -p "rename session:" "rename-session '%%'"

# `d - Detach from current session
# (Already works by default)

# `D - Detach other clients
bind D detach-client -a

# `( and `) - Switch to previous/next session
bind '(' switch-client -p
bind ')' switch-client -n

# ==========================
# Quick Actions
# ==========================

# `r - Reload tmux configuration with notification
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# `t - Show time in current pane
bind t clock-mode

# `i - Display pane information
bind i display-panes

# `e - Edit tmux config in default editor
bind e new-window -n 'tmux-config' "sh -c '\${EDITOR:-vim} ~/.tmux.conf'"

# `S - Synchronize panes (type in all panes simultaneously)
bind S setw synchronize-panes \; display-message "Sync panes: #{?synchronize-panes,ON,OFF}"

# `b - Toggle status bar visibility
bind b set -g status \; display-message "Status bar: #{?status,ON,OFF}"

# ==========================
# Status Bar Configuration
# ==========================

# Enable status bar
set -g status on

# Update the status bar every 15 seconds: it shows HH:MM and the battery
# level, and each update starts a shell to read the battery.
set -g status-interval 15

# ==========================
# Activity Monitoring
# ==========================

# Highlight window with activity (subtle)
setw -g monitor-activity on
set -g visual-activity off  # Don't show message, just highlight

# Window with activity styling
setw -g window-status-activity-style 'fg=#ffc777,bold'

# ==========================
# Advanced Features
# ==========================

# Word separators for double-click selection: whitespace, quotes, brackets
# and list punctuation, so identifiers, flags and paths select whole.
set -g word-separators " \"'()[]{}<>,;"

# Closing a session's last window switches to another session instead of
# detaching.
set -g detach-on-destroy off

# Aggressive resize (useful when sharing sessions)
setw -g aggressive-resize on

# Increase display time of pane numbers
set -g display-panes-time 2000

# ==========================
# Popup window styling (tmux 3.2+)
# ==========================

# Floating popup window style
set -g popup-style 'bg=#1e2030,fg=#c8d3f5'
set -g popup-border-style 'fg=#82aaff'

# ==========================
# Quick Reference (after pressing `)
# ==========================
# Window Management:
#   c        - new window
#   n/p      - next/previous window
#   1-9      - switch to window N
#   w        - list windows
#   ,        - rename window
#   x        - kill window
#
# Pane Management:
#   |        - split horizontal
#   -        - split vertical
#   h/j/k/l  - navigate panes
#   H/J/K/L  - resize panes
#   z        - zoom pane
#   q        - kill pane (confirm)
#   C-hjkl   - move between panes/nvim splits (no prefix); `C-l clears
#   Space    - toggle layouts
#
# Copy Mode (with system clipboard):
#   [        - enter copy mode
#   v        - begin selection
#   y        - copy to clipboard
#   ]        - paste
#
# Sessions:
#   s        - list sessions
#   $        - rename session
#   d        - detach
#   (/)      - prev/next session
#
# Other:
#   r        - reload config
#   b        - toggle status bar
#   ?        - show all bindings
#   S        - sync panes toggle
#
